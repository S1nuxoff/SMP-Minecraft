DataSource:
  backend: SQLite

settings:
  registration:
    enabled: true
    registrationMethod: PASSWORD
    forceRegister: true
    timeout: 0
    maxRegistrationPerIp: 3
    messageInterval: 5

  restrictions:
    allowMovement: true
    allowedCommands:
      - /login
      - /l
      - /reg
      - /register
    timeout: 0
    teleportUnAuthedToSpawn: true

  spawn:
    teleportToSpawnAfterLogin: true
    spawnPriority: authme_first_spawn,first_spawn,spawn,multiverse

  security:
    minPasswordLength: 5
    maxPasswordLength: 30
    passwordHash: BCRYPT
    sessionExpireTime: 0

hooks:
  login:
    - 'title %p times 20 80 20'
    - 'title %p title {"text":"Ласкаво просимо!","color":"gold","bold":true}'
    - 'title %p subtitle {"text":"Надіюсь 2 тижні протягнемо","color":"white","italic":true}'

  gui:
    dialog:
      preJoin:
        enable: false
      postJoin:
        enable: false

messages:
  messagesLanguage: uk
  perPlayerLocale: false
