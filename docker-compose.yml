services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.4"
      MEMORY: "2G"
      MAX_PLAYERS: "20"
      MOTD: "My Minecraft Server"
      DIFFICULTY: "normal"
      ONLINE_MODE: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      # Автоматически скачивает плагины при старте (ID с spiget.org)
      # 6269 = AuthMe, 390 = Multiverse-Core
      SPIGET_RESOURCES: "6269,390"
    volumes:
      - minecraft_data:/data
      - ./plugins:/data/plugins
      - ./worlds/authlobby:/data/authlobby
    tty: true
    stdin_open: true

volumes:
  minecraft_data:
