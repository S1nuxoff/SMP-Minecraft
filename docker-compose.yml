services:
  minecraft:
    build: .
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.1.2"
      MEMORY: "2G"
      MAX_PLAYERS: "20"
      MOTD: "My Minecraft Server"
      DIFFICULTY: "normal"
      ONLINE_MODE: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
    volumes:
      - minecraft_data:/data
      - ./worlds/authlobby:/data/authlobby
    tty: true
    stdin_open: true

volumes:
  minecraft_data:
